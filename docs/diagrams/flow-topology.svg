<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1620" width="1400" height="1620" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#D97706"/>
    </marker>
  </defs>
  <rect width="1400" height="1620" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="60" y="72" font-size="40" font-weight="700" fill="#0F172A">KuWarden flow topology</text>
  <text x="60" y="108" font-size="19" fill="#64748B">Eight nodes. One bounded loop. Verification in fresh context. Human attention allocated by risk.</text>
  <text x="1340" y="72" font-size="14" fill="#94A3B8" text-anchor="end">ADR 0002</text>

  <!-- Legend -->
  <g font-size="14" font-weight="600">
    <rect x="60" y="128" width="14" height="14" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/><text x="82" y="140" fill="#475569">LLM node</text>
    <rect x="182" y="128" width="14" height="14" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="2"/><text x="204" y="140" fill="#475569">deterministic — no LLM</text>
    <rect x="404" y="128" width="14" height="14" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="426" y="140" fill="#475569">★ reality anchor</text>
    <rect x="574" y="128" width="14" height="14" rx="3" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/><text x="596" y="140" fill="#475569">human gate</text>
    <rect x="712" y="128" width="14" height="14" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="734" y="140" fill="#475569">compensation</text>
  </g>

  <!-- ===== Spine edges (drawn first, behind nodes) ===== -->
  <g stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <path d="M680 226 V254"/>
    <path d="M680 362 V394"/>
    <path d="M680 478 V510"/>
    <path d="M680 614 V646"/>
    <path d="M680 750 V782"/>
    <path d="M680 970 V1002"/>
    <path d="M680 1120 V1152"/>
    <path d="M680 1248 V1280"/>
    <path d="M680 1368 V1400"/>
  </g>

  <!-- Inner loop: Build&Test -> Coder -->
  <path d="M380 702 H336 Q316 702 316 682 V586 Q316 566 336 566 H376" stroke="#4F46E5" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="326" y="640" font-size="15" font-weight="700" fill="#4F46E5" text-anchor="middle" transform="rotate(-90 326 640)">fail · retry &lt; N</text>

  <!-- Verifier blocked -> Coder (right corridor) -->
  <path d="M980 880 H1024 Q1044 880 1044 860 V586 Q1044 566 1024 566 H984" stroke="#4F46E5" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="1056" y="726" font-size="15" font-weight="700" fill="#4F46E5" text-anchor="middle" transform="rotate(-90 1056 726)">blocked · retry</text>

  <!-- ===== Nodes ===== -->

  <!-- Ticket -->
  <rect x="440" y="170" width="480" height="56" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="680" y="205" font-size="20" fill="#0F172A" text-anchor="middle">Jira / Azure DevOps ticket</text>

  <!-- 1 Router -->
  <path d="M380 312 L416 254 H944 L980 312 L944 370 H416 Z" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="680" y="292" font-size="22" font-weight="700" fill="#064E3B" text-anchor="middle">① Triage &amp; Risk Router — <tspan font-style="italic">provisional</tspan> tier</text>
  <text x="680" y="318" font-size="16" fill="#047857" text-anchor="middle">rules-first · LLM may raise a tier, never lower it</text>
  <text x="680" y="340" font-size="15" font-style="italic" fill="#047857" text-anchor="middle">the diff does not exist yet — final tier is set after ④</text>
  <path d="M980 312 H1120" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#a)" stroke-dasharray="6 5"/>
  <rect x="1124" y="284" width="236" height="56" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="1242" y="308" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">Reject to human</text>
  <text x="1242" y="329" font-size="14" fill="#475569" text-anchor="middle">unclear / out of scope</text>

  <!-- 2 Planner -->
  <rect x="440" y="394" width="480" height="84" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2.5"/>
  <text x="680" y="428" font-size="22" font-weight="700" fill="#1E1B4B" text-anchor="middle">② Planner</text>
  <text x="680" y="456" font-size="16" fill="#4338CA" text-anchor="middle">ticket + codebase → structured ChangePlan</text>

  <!-- 3 Coder -->
  <rect x="380" y="510" width="600" height="104" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="3"/>
  <text x="680" y="548" font-size="22" font-weight="700" fill="#1E1B4B" text-anchor="middle">③ Coder — bounded inner loop</text>
  <text x="680" y="576" font-size="16" fill="#4338CA" text-anchor="middle">works in an ephemeral sandbox · no credentials · no egress</text>
  <text x="680" y="600" font-size="16" fill="#4338CA" text-anchor="middle">receives the previous attempt's compiler + test output</text>

  <!-- 4 Build & Test -->
  <rect x="380" y="646" width="600" height="104" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
  <text x="680" y="684" font-size="22" font-weight="700" fill="#78350F" text-anchor="middle">★ ④ Build &amp; Test — NO LLM</text>
  <text x="680" y="712" font-size="16" fill="#92400E" text-anchor="middle">the verdict is the CI system's exit code</text>
  <text x="680" y="736" font-size="16" font-weight="700" fill="#92400E" text-anchor="middle">the Coder's opinion of its own work is not an input</text>

  <!-- 5 Verifiers -->
  <rect x="380" y="782" width="600" height="188" rx="14" fill="#F8FAFC" stroke="#4F46E5" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="680" y="814" font-size="22" font-weight="700" fill="#1E1B4B" text-anchor="middle">⑤ Verifiers — fan-out, adversarial</text>
  <text x="680" y="840" font-size="16" font-weight="700" fill="#4338CA" text-anchor="middle">fresh context · never sees the Coder's reasoning</text>
  <g font-size="15" font-weight="600" text-anchor="middle" fill="#1E1B4B">
    <rect x="400" y="856" width="136" height="94" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
    <text x="468" y="898">correctness</text><text x="468" y="920" font-size="13" font-weight="400" fill="#4338CA">meets accept.</text><text x="468" y="937" font-size="13" font-weight="400" fill="#4338CA">criteria?</text>
    <rect x="546" y="856" width="136" height="94" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
    <text x="614" y="898">security</text><text x="614" y="920" font-size="13" font-weight="400" fill="#4338CA">SAST + injection</text><text x="614" y="937" font-size="13" font-weight="400" fill="#4338CA">authz · secrets</text>
    <rect x="692" y="856" width="136" height="94" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
    <text x="760" y="898">test evidence</text><text x="760" y="920" font-size="13" font-weight="400" fill="#4338CA">were tests met,</text><text x="760" y="937" font-size="13" font-weight="400" fill="#4338CA">or weakened?</text>
    <rect x="838" y="856" width="122" height="94" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
    <text x="899" y="898">regression</text><text x="899" y="920" font-size="13" font-weight="400" fill="#4338CA">untested paths</text><text x="899" y="937" font-size="13" font-weight="400" fill="#4338CA">reached?</text>
  </g>

  <!-- 6 Gate -->
  <path d="M380 1057 L420 1002 H940 L980 1057 L940 1112 H420 Z" fill="#FCE7F3" stroke="#DB2777" stroke-width="3"/>
  <text x="680" y="1038" font-size="22" font-weight="700" fill="#831843" text-anchor="middle">⑥ Approval Gate — depth set by <tspan font-style="italic">final</tspan> risk_tier</text>
  <text x="680" y="1062" font-size="15" font-weight="700" fill="#9D174D" text-anchor="middle">final tier computed from the actual diff — may only raise the provisional tier</text>
  <text x="680" y="1084" font-size="16" fill="#9D174D" text-anchor="middle">low: no human   ·   medium: 1 approver   ·   high: 2 approvers</text>
  <text x="680" y="1104" font-size="15" font-style="italic" fill="#9D174D" text-anchor="middle">Temporal suspends the run — it may wait days, holding nothing open</text>

  <!-- 7 Deploy -->
  <rect x="440" y="1152" width="480" height="96" rx="14" fill="#ECFDF5" stroke="#059669" stroke-width="3"/>
  <text x="680" y="1184" font-size="22" font-weight="700" fill="#064E3B" text-anchor="middle">⑦ Release — the control point</text>
  <text x="680" y="1210" font-size="16" font-weight="700" fill="#047857" text-anchor="middle">mechanism set by integration_model · A / B / C — ADR 0004</text>
  <text x="680" y="1232" font-size="15" fill="#047857" text-anchor="middle">the Coder holds none of these permissions, in any model</text>

  <!-- Health -->
  <rect x="440" y="1280" width="480" height="88" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
  <text x="680" y="1314" font-size="21" font-weight="700" fill="#78350F" text-anchor="middle">★ Health check — NO LLM</text>
  <text x="680" y="1341" font-size="16" fill="#92400E" text-anchor="middle">pod readiness + service endpoint</text>
  <text x="680" y="1361" font-size="16" fill="#92400E" text-anchor="middle">+ error rate over the soak window</text>

  <!-- Reporter -->
  <rect x="440" y="1400" width="480" height="76" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="680" y="1430" font-size="20" font-weight="700" fill="#064E3B" text-anchor="middle">Reporter → ticket</text>
  <text x="680" y="1456" font-size="15" fill="#047857" text-anchor="middle">PR · CI · coverage · SAST · verifier verdicts · who approved</text>

  <!-- 8 Abort -->
  <rect x="1060" y="1120" width="300" height="150" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/>
  <text x="1210" y="1158" font-size="21" font-weight="700" fill="#7F1D1D" text-anchor="middle">⑧ Abort / Rollback</text>
  <text x="1210" y="1186" font-size="15" fill="#991B1B" text-anchor="middle">rollback · delete branch</text>
  <text x="1210" y="1208" font-size="15" fill="#991B1B" text-anchor="middle">transition ticket · notify</text>
  <text x="1210" y="1238" font-size="14" font-style="italic" fill="#991B1B" text-anchor="middle">runs even if the worker</text>
  <text x="1210" y="1257" font-size="14" font-style="italic" fill="#991B1B" text-anchor="middle">process already died</text>

  <!-- Abort edges -->
  <g stroke="#DC2626" stroke-width="2.5" fill="none" marker-end="url(#ar)" stroke-dasharray="7 5">
    <path d="M980 698 H1210 V1116"/>
    <path d="M980 1057 H1056"/>
    <path d="M920 1324 H1210 V1274"/>
  </g>
  <text x="1210" y="686" font-size="14" font-weight="700" fill="#DC2626" text-anchor="middle">budget spent</text>
  <text x="998" y="1046" font-size="14" font-weight="700" fill="#DC2626">reject / timeout</text>
  <text x="990" y="1316" font-size="14" font-weight="700" fill="#DC2626">unhealthy</text>
  <path d="M1210 1270 V1290 H960" stroke="#DC2626" stroke-width="2.5" fill="none" marker-end="url(#ar)" stroke-dasharray="7 5" opacity="0"/>
  <path d="M1060 1195 H930 Q912 1195 912 1213 V1400" stroke="#DC2626" stroke-width="2.5" fill="none" marker-end="url(#ar)" stroke-dasharray="7 5"/>

  <!-- Left annotations -->
  <g font-size="15" fill="#475569">
    <rect x="40" y="392" width="252" height="88" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="56" y="418" font-weight="700" fill="#0F172A">Context flows forward</text>
    <text x="56" y="440">Planner → Coder inherits</text>
    <text x="56" y="459">context. This is correct</text>
    <text x="56" y="474" font-size="14" font-style="italic">— and stops here.</text>

    <rect x="40" y="800" width="252" height="112" rx="10" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="56" y="826" font-weight="700" fill="#7C2D12">Isolation rule</text>
    <text x="56" y="848">A verifier that inherits the</text>
    <text x="56" y="867">author's reasoning reads a</text>
    <text x="56" y="886">finished defence — and</text>
    <text x="56" y="905" font-weight="700" fill="#7C2D12">approves it.</text>

    <rect x="40" y="1000" width="252" height="132" rx="10" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.5"/>
    <text x="56" y="1026" font-weight="700" fill="#831843">Why tiering</text>
    <text x="56" y="1048">Uniform gates are right for</text>
    <text x="56" y="1067">10 runs and fatal at 100:</text>
    <text x="56" y="1086">they turn the platform into</text>
    <text x="56" y="1105">a queue in front of a human</text>
    <text x="56" y="1124">— the very constraint</text>
  </g>
  <text x="56" y="1143" font-size="15" font-weight="700" fill="#831843">KuWarden exists to relieve.</text>

  <!-- Footer rule -->
  <rect x="40" y="1516" width="1320" height="72" rx="12" fill="#0F172A"/>
  <text x="700" y="1548" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Loops are not abolished — they are contained.</text>
  <text x="700" y="1574" font-size="16" fill="#94A3B8" text-anchor="middle">A loop lives inside a node, where its context is bounded and its retries are budgeted. The flow between nodes stays deterministic.</text>
</svg>
