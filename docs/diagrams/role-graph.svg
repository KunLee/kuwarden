<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1600" height="1040" fill="#FFFFFF"/>

  <text x="80" y="66" font-size="42" font-weight="700" fill="#0F172A">The role graph</text>
  <text x="80" y="104" font-size="19" fill="#64748B">Slow-changing, version-controlled, CI-enforced. Permissions are fixed before a run starts and are never model-decided.</text>
  <text x="1520" y="66" font-size="14" fill="#94A3B8" text-anchor="end">KuWarden · policy.yaml · ADR 0003</text>

  <!-- Column headers -->
  <g font-size="14" font-weight="700" fill="#475569" letter-spacing="1.6">
    <text x="80" y="172">IDENTITIES — who exists</text>
    <text x="580" y="172">ROLES — bundles</text>
    <text x="1040" y="172">CAPABILITIES — what can be done</text>
  </g>

  <!-- ===== Edges (behind) ===== -->
  <g stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#g)">
    <path d="M520 270 H576"/>
    <path d="M520 464 H576"/>
    <path d="M960 434 H1036"/>
    <path d="M520 696 H576"/>
    <path d="M960 640 Q1000 640 1000 584 H1036"/>
    <path d="M960 700 Q1000 700 1000 734 H1036"/>
  </g>

  <!-- ===== IDENTITIES ===== -->
  <rect x="80" y="200" width="440" height="140" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/>
  <text x="104" y="232" font-size="20" font-weight="700" fill="#0F172A">HUMAN — from enterprise IdP</text>
  <g font-size="16" fill="#334155">
    <text x="104" y="264">human.engineer</text>
    <text x="104" y="292">human.tech-lead</text>
    <text x="104" y="320">human.release-manager</text>
  </g>

  <rect x="80" y="364" width="440" height="200" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="3"/>
  <text x="104" y="396" font-size="20" font-weight="700" fill="#1E1B4B">AGENT NODES</text>
  <rect x="316" y="376" width="182" height="26" rx="13" fill="#312E81"/>
  <text x="407" y="395" font-size="13" font-weight="700" fill="#C7D2FE" text-anchor="middle">CONTAINS AN LLM</text>
  <g font-size="16" fill="#3730A3">
    <text x="104" y="428">node.planner</text>
    <text x="104" y="456">node.coder</text>
    <text x="104" y="484">node.verifier</text>
  </g>
  <text x="104" y="516" font-size="15" font-style="italic" fill="#4338CA">identity = SPIFFE SVID, not a name —</text>
  <text x="104" y="538" font-size="15" font-style="italic" fill="#4338CA">the receiving system verifies it independently</text>

  <rect x="80" y="588" width="440" height="216" rx="14" fill="#ECFDF5" stroke="#059669" stroke-width="3"/>
  <text x="104" y="620" font-size="20" font-weight="700" fill="#064E3B">CONTROL PLANE</text>
  <rect x="352" y="600" width="146" height="26" rx="13" fill="#064E3B"/>
  <text x="425" y="619" font-size="13" font-weight="700" fill="#A7F3D0" text-anchor="middle">NO LLM</text>
  <g font-size="16" fill="#047857">
    <text x="104" y="652">engine.flow</text>
    <text x="104" y="680">engine.credential-broker</text>
  </g>
  <text x="104" y="716" font-size="15" font-style="italic" fill="#047857">holds precisely what the agents must not:</text>
  <text x="104" y="738" font-size="15" font-style="italic" fill="#047857">CI trigger · PR merge · deployment</text>
  <text x="104" y="774" font-size="15" font-weight="700" fill="#065F46">deny: llm.invoke</text>

  <!-- ===== ROLES ===== -->
  <rect x="580" y="200" width="380" height="140" rx="14" fill="#FCE7F3" stroke="#DB2777" stroke-width="2.5"/>
  <text x="604" y="232" font-size="19" font-weight="700" fill="#831843">approval_authority</text>
  <g font-size="15" fill="#9D174D">
    <text x="604" y="262">low → 0 · medium → 1 · high → 2</text>
    <text x="604" y="288">exclude_change_author: true</text>
    <text x="604" y="314">require_distinct_teams (high)</text>
  </g>
  <text x="604" y="334" font-size="14" font-weight="700" fill="#831843">principals must all be human</text>

  <rect x="580" y="364" width="380" height="200" rx="14" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2.5"/>
  <g font-size="16" font-weight="600" fill="#1E1B4B">
    <rect x="604" y="384" width="332" height="36" rx="8" fill="#EEF2FF"/><text x="620" y="409">role.planner</text>
    <rect x="604" y="428" width="332" height="36" rx="8" fill="#EEF2FF"/><text x="620" y="453">role.coder</text>
    <rect x="604" y="472" width="332" height="36" rx="8" fill="#EEF2FF"/><text x="620" y="497">role.verifier</text>
  </g>
  <text x="604" y="536" font-size="15" font-weight="700" fill="#DC2626">deny: deploy.* · scm.pr.merge</text>
  <text x="604" y="556" font-size="14" font-style="italic" fill="#64748B">explicit — not merely ungranted</text>

  <rect x="580" y="588" width="380" height="216" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="2.5"/>
  <g font-size="16" font-weight="600" fill="#064E3B">
    <rect x="604" y="612" width="332" height="36" rx="8" fill="#ECFDF5"/><text x="620" y="637">role.flow-engine</text>
    <rect x="604" y="660" width="332" height="36" rx="8" fill="#ECFDF5"/><text x="620" y="685">role.deployer</text>
  </g>
  <text x="604" y="726" font-size="15" fill="#047857">bindings scope by app + environment,</text>
  <text x="604" y="748" font-size="15" fill="#047857">so onboarding an app is not a</text>
  <text x="604" y="770" font-size="15" fill="#047857">policy change — otherwise teams</text>
  <text x="604" y="792" font-size="15" font-style="italic" fill="#047857">route around the governance.</text>

  <!-- ===== CAPABILITIES ===== -->
  <rect x="1040" y="364" width="480" height="140" rx="14" fill="#F8FAFC" stroke="#64748B" stroke-width="2.5"/>
  <text x="1064" y="396" font-size="19" font-weight="700" fill="#0F172A">READ &amp; BUILD</text>
  <g font-size="16" fill="#334155">
    <text x="1064" y="426">scm.repo.read · scm.branch.write.own</text>
    <text x="1064" y="454">sandbox.exec · sast.run</text>
    <text x="1064" y="482">llm.invoke</text>
  </g>

  <rect x="1040" y="524" width="480" height="120" rx="14" fill="#F8FAFC" stroke="#64748B" stroke-width="2.5"/>
  <text x="1064" y="556" font-size="19" font-weight="700" fill="#0F172A">ORCHESTRATION</text>
  <g font-size="16" fill="#334155">
    <text x="1064" y="586">cicd.pipeline.trigger · scm.pr.create</text>
    <text x="1064" y="614">scm.pr.merge · ticket.transition</text>
  </g>

  <rect x="1040" y="664" width="480" height="140" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="4"/>
  <text x="1064" y="696" font-size="19" font-weight="700" fill="#7F1D1D">DEPLOY</text>
  <g font-size="16" fill="#991B1B">
    <text x="1064" y="726">deploy.k8s.test · uat · prod</text>
    <text x="1064" y="754">deploy.rollback</text>
  </g>
  <text x="1064" y="788" font-size="15" font-weight="700" fill="#7F1D1D">unreachable from any LLM-bearing identity</text>

  <!-- ===== The barrier ===== -->
  <path d="M960 470 Q1010 470 1010 620 Q1010 700 1036 712" stroke="#DC2626" stroke-width="3" fill="none" stroke-dasharray="9 7"/>
  <g transform="translate(1010,566)">
    <circle r="24" fill="#FFFFFF" stroke="#DC2626" stroke-width="3.5"/>
    <path d="M-11 -11 L11 11 M11 -11 L-11 11" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ===== Constraints ===== -->
  <rect x="80" y="836" width="1440" height="160" rx="16" fill="#0F172A"/>
  <text x="106" y="874" font-size="22" font-weight="700" fill="#FBBF24">CONSTRAINTS — evaluated in CI on every change to policy.yaml. A violation fails the build.</text>
  <g font-size="16" fill="#E2E8F0" font-family="Consolas, Menlo, monospace">
    <text x="106" y="910">no-llm-holds-deploy</text>
    <text x="106" y="938">no-llm-merges</text>
    <text x="106" y="966">control-plane-has-no-llm</text>
    <text x="620" y="910">prod-requires-two-humans</text>
    <text x="620" y="938">no-agent-self-approval</text>
    <text x="620" y="966">every-identity-is-verifiable</text>
  </g>
  <text x="1180" y="924" font-size="17" font-style="italic" fill="#94A3B8">Governance that exists only in prose</text>
  <text x="1180" y="950" font-size="17" font-style="italic" fill="#94A3B8">is governance that gets violated</text>
  <text x="1180" y="976" font-size="17" font-style="italic" fill="#94A3B8">without anyone noticing.</text>

  <text x="80" y="1026" font-size="16" fill="#64748B">The red barrier is not a drawing convention — it is constraint <tspan font-family="Consolas, monospace" fill="#0F172A">no-llm-holds-deploy</tspan>, and CI proves it holds on every commit.</text>
</svg>
