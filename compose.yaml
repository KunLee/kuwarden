# Local development infrastructure.
#
# The engine is deliberately not a service here. It runs on the host under
# `uv run`, so editing code does not mean rebuilding an image — and so that
# everything in this file is exactly the part a cloud deployment swaps for a
# managed service (Temporal -> Temporal Cloud, PostgreSQL -> RDS). When that
# happens this file is deleted, not rewritten.
#
# Ports bind to 127.0.0.1. That is defence in depth, not the control: the database
# password is required from the environment and has no default here.

name: kuwarden

services:
  # Dev server: one binary, embedded SQLite, Web UI included. Production uses
  # temporalio/auto-setup against an external database — that is a different
  # image and a different problem, and it is not needed to run a flow.
  temporal:
    image: docker.io/temporalio/temporal:1.8.2
    command:
      - server
      - start-dev
      - --ip=0.0.0.0
      - --db-filename=/home/temporal/temporal.db
      - --namespace=${KUWARDEN_TEMPORAL_NAMESPACE:-kuwarden}
      - --log-level=${KUWARDEN_TEMPORAL_LOG_LEVEL:-warn}
    ports:
      - "127.0.0.1:${KUWARDEN_TEMPORAL_PORT:-7233}:7233"
      - "127.0.0.1:${KUWARDEN_TEMPORAL_UI_PORT:-8233}:8233"
    volumes:
      # Mounted at $HOME rather than a subdirectory: this path already exists in
      # the image owned by uid 1000, so the volume inherits that ownership. A
      # volume at a path the image does not have is created root-owned, and the
      # server then fails to open its own database.
      - temporal-data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # KuWarden's own state — app registry, approvals, audit projection, run tree.
  # Separate from Temporal's persistence above, which is Temporal's private
  # concern and never queried by us.
  postgres:
    image: docker.io/library/postgres:17.9-alpine
    environment:
      POSTGRES_USER: ${KUWARDEN_POSTGRES_USER:-kuwarden}
      # Required, with no default. A literal default here is a committed credential --
      # which is what it looked like to secret scanning, correctly. `:?` fails the
      # `compose up` with this message rather than silently starting on a known password.
      POSTGRES_PASSWORD: ${KUWARDEN_POSTGRES_PASSWORD:?set KUWARDEN_POSTGRES_PASSWORD in .env — see .env.example}
      POSTGRES_DB: ${KUWARDEN_POSTGRES_DB:-kuwarden}
    ports:
      - "127.0.0.1:${KUWARDEN_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${KUWARDEN_POSTGRES_USER:-kuwarden} -d ${KUWARDEN_POSTGRES_DB:-kuwarden}
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

# Named volumes only. A bind mount would tie this file to a host path and have
# to be rewritten to run anywhere else.
volumes:
  temporal-data:
  postgres-data:
